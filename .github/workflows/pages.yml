# Builds web/ (the server-free UI) and publishes it to GitHub Pages.
#
# Enable this once in the repository: Settings → Pages → Build and deployment → Source:
# GitHub Actions. Every push to main then redeploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one before it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # web/public/CNAME is the single source of truth for the custom domain: Pages reads it to
      # keep the domain, and a custom domain serves the site from the root rather than /<repo>/.
      - name: Work out the path the site is served from
        run: |
          if [ -f web/public/CNAME ]; then
            echo "Custom domain $(cat web/public/CNAME): serving from /"
            echo "SORTIFY_BASE=/" >> "$GITHUB_ENV"
          else
            echo "Project page: serving from /${{ github.event.repository.name }}/"
            echo "SORTIFY_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
